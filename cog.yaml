build:
  gpu: true
  # Toolkit in image must match PyTorch CUDA flavor in requirements.txt (cu121) or flash-attn wheel build fails.
  cuda: "12.1"
  system_packages:
    - ffmpeg
  python_version: "3.12"
  python_requirements: requirements.txt
  run:
    - curl -o /usr/local/bin/pget -L "https://github.com/replicate/pget/releases/latest/download/pget_$(uname -s)_$(uname -m)" && chmod +x /usr/local/bin/pget
    # requirements.txt ends on PyPI; the resolver upgrades torch to e.g. 2.11+cu130 for xformers/xfuser.
    # flash-attn compiles against the image CUDA (12.1), so torch must be cu121 here — reinstall immediately before flash-attn.
    - pip uninstall -y torch torchvision torchaudio || true
    - pip install --no-cache-dir torch==2.5.1 torchvision==0.20.1 torchaudio==2.5.1 --index-url https://download.pytorch.org/whl/cu121
    - python -c "import torch; print('TORCH_DEBUG', torch.__version__, torch.version.cuda)"
    - pip install --no-cache-dir flash-attn --no-build-isolation --no-deps
predict: "predict.py:Predictor"
